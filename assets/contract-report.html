<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智能合同审核报告</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937;line-height:1.75;max-width:920px;margin:0 auto;padding:40px}
    h1{font-size:28px;text-align:center;margin-bottom:22px}table{width:100%;border-collapse:collapse;margin:16px 0}
    th,td{border:1px solid #d1d5db;padding:10px;vertical-align:top}th{background:#f3f4f6}
    .level-high{color:#b91c1c;font-weight:700}.level-medium{color:#b45309;font-weight:700}.level-low{color:#047857;font-weight:700}
    .muted{color:#6b7280;font-size:13px}
  </style>
</head>
<body>
  <h1>智能合同审核报告</h1>
  <p class="muted">审核立场：{{STANDING}}；风险点数量：{{RISK_COUNT}}</p>
  <table>
    <thead><tr><th>序号</th><th>等级</th><th>风险条款</th><th>风险分析</th><th>修改建议</th></tr></thead>
    <tbody>{{RISK_ROWS}}</tbody>
  </table>
</body>
</html>
